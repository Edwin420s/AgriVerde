version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: agriverde_user
      POSTGRES_PASSWORD: agriverde_password
      POSTGRES_DB: agriverde_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
